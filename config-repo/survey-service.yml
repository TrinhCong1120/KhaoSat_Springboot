spring:
  application:
    name: survey-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:surveyDB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Cong12345@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:survey-media}
    region: ${MINIO_REGION:us-east-1}
    presigned-expiry-seconds: ${MINIO_PRESIGNED_EXPIRY_SECONDS:600}

server:
  port: 8082
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:KeyNayPhaiDaiHon32KyTuDeBaoMat123456}
  issuer: ${JWT_ISSUER:myapp}
  audience: ${JWT_AUDIENCE:myapp}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:survey-service}
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
