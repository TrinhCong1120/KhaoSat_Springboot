spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:surveyDB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Cong12345@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:KeyNayPhaiDaiHon32KyTuDeBaoMat123456}
  issuer: ${JWT_ISSUER:myapp}
  audience: ${JWT_AUDIENCE:myapp}
  expiration: ${JWT_EXPIRATION:3600000}
  remember-expiration: ${JWT_REMEMBER_EXPIRATION:2592000000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
