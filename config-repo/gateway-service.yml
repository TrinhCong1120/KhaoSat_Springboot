spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/Auth/**
              metadata:
                connect-timeout: 3000
                response-timeout: 10000

            - id: core-service
              uri: lb://core-service
              predicates:
                - Path=/api/Users/**,/api/Roles/**,/api/Menus/**,/api/Functions/**

            - id: survey-validation-rules
              uri: lb://survey-service
              predicates:
                - Path=/api/ValidationRules/**

            - id: survey-service
              uri: lb://survey-service
              predicates:
                - Path=/api/Surveys/**,/api/Pages/**,/api/Responses/**,/api/Dashboard/**,/api/FailedSurveys/**,/api/Questions/**,/api/Reports/**,/api/Conditions/**,/api/Media/**,/api/public/surveys/**,/api/public/site-visits,/api/public/site-visits/**
              filters:
                - PreserveHostHeader

            - id: survey-media
              uri: http://minio:9000
              predicates:
                - Path=/survey-media/**
              filters:
                - PreserveHostHeader

            - id: survey-media-api
              uri: http://minio:9000
              predicates:
                - Path=/api/survey-media/**
              filters:
                - StripPrefix=1
                - PreserveHostHeader
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            - id: auth-service-openapi
              uri: lb://auth-service
              predicates:
                - Path=/swagger/auth/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: core-service-openapi
              uri: lb://core-service
              predicates:
                - Path=/swagger/core/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: survey-service-openapi
              uri: lb://survey-service
              predicates:
                - Path=/swagger/survey/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

app:
  cors:
    enabled: true
    allowed-origins:
      - "http://localhost:3000"
    allowed-origin-patterns:
      - "https://*.ngrok-free.app"


    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - "*"

    exposed-headers:
      - Authorization
      - Retry-After

    allow-credentials: true
    max-age: 3600

  rate-limit:
    # Chỉ bật khi Gateway chỉ nhận kết nối từ Nginx đáng tin cậy.
    trust-proxy-header: ${RATE_LIMIT_TRUST_PROXY_HEADER:false}
    max-clients: ${RATE_LIMIT_MAX_CLIENTS:20000}
    global:
      per-second: 30
      per-minute: 300
    login:
      per-second: 2
      per-minute: 10
    submit:
      per-second: 2
      per-minute: 10
    validate:
      per-second: 3
      per-minute: 30
    survey-get:
      per-second: 5
      per-minute: 60
    media-get:
      per-second: 15
      per-minute: 120
    media-put:
      per-second: 2
      per-minute: 20
    other-public:
      per-second: 10
      per-minute: 120

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /swagger/auth/v3/api-docs
      - name: core-service
        url: /swagger/core/v3/api-docs
      - name: survey-service
        url: /swagger/survey/v3/api-docs

management:
  server:
    port: 8085
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always
