worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Ho tro WebSocket (Next.js Fast Refresh & HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway_backend {
        server gateway-service:8080;
    }

    upstream frontend_client {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Docker internal DNS resolver with auto-refresh and IPv4 preference
        resolver 127.0.0.11 valid=10s ipv6=off;

        # =========================================================================
        # 1. Toan bo Backend, API, Swagger, Webjars & Media
        # Gom chung bang regex: tu dong nhan tat ca route moi bat dau bang:
        # /api/..., /v3/api-docs..., /swagger..., /webjars..., /survey-media...
        # -> Khong bao gio can phai khai bao them location moi khi them api/swagger!
        # =========================================================================
        location ~* ^/(api|v3/api-docs|swagger|webjars|survey-media) {
            set $backend "http://gateway-service:8080";
            proxy_pass $backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # =========================================================================
        # 2. Toan bo request con lai -> Frontend (Next.js)
        # =========================================================================
        location / {
            set $frontend "http://host.docker.internal:3000";
            proxy_pass $frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # Next.js WebSocket (HMR / Fast Refresh)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
