services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  minio:
    image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-survey-media}
      MINIO_BROWSER: "on"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  config-service:
    build:
      context: ./config-service
      dockerfile: Dockerfile
      network: host
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv6Addresses=true -Djava.net.preferIPv4Stack=false"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
    restart: on-failure:5
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro

  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
      network: host
    environment:
      CONFIG_SERVER_URL: configserver:http://config-service:8888
      JAVA_OPTS: "-Djava.net.preferIPv6Addresses=true -Djava.net.preferIPv4Stack=false"
    restart: on-failure:5
    ports:
      - "8761:8761"
    depends_on:
      - config-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      network: host
    environment: &app-env
      CONFIG_SERVER_URL: configserver:http://config-service:8888
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_OPTS: "-Djava.net.preferIPv6Addresses=true -Djava.net.preferIPv4Stack=false"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
      network: host
    environment: *app-env
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started

  survey-service:
    build:
      context: ./survey-service
      dockerfile: Dockerfile
      network: host
    environment:
      <<: *app-env
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-survey-media}
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      network: host
    environment:
      <<: *app-env
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    restart: on-failure:5
    depends_on:
      kafka:
        condition: service_healthy
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
      network: host
    environment:
      <<: *app-env
      RATE_LIMIT_TRUST_PROXY_HEADER: ${RATE_LIMIT_TRUST_PROXY_HEADER:-false}
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure:5
    depends_on:
      config-service:
        condition: service_started
      discovery-service:
        condition: service_started
      auth-service:
        condition: service_started
      core-service:
        condition: service_started
      survey-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  postgres-data:
  kafka-data:
  minio-data:

networks:
  default:
    enable_ipv6: true
